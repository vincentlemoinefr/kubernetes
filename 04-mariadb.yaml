# =============================================================================
# STEP 4 - The database (EX-02, EX-03, EX-04, EX-06, EX-08, EX-10)
# =============================================================================
# Build this floor alone and validate it before plugging anything into it.
#
# Apply:
#   kubectl apply -f 04-mariadb.yaml
# Watch it come up (first boot initialises the data directory, ~30s):
#   kubectl logs -f deploy/mariadb -n cloud
# Validate from inside the cluster, with a throwaway pod:
#   kubectl run debug -it --rm --image=busybox:1.36 --restart=Never -n cloud -- sh
#     nslookup mariadb
#     nc -zv mariadb 3306
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: cloud
  labels:
    app: mariadb
    tier: database
spec:
  replicas: 1
  strategy:
    # Never two pods on one ReadWriteOnce volume. See step 3.
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
        tier: database
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.11
          # Required by Nextcloud. Passed as container args, which the MariaDB
          # entrypoint forwards straight to mysqld.
          args:
            - --transaction-isolation=READ-COMMITTED
            - --binlog-format=ROW
          ports:
            - name: mysql
              containerPort: 3306
          env:
            # --- non-sensitive: from the ConfigMap ---
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: cloud-config
                  key: MYSQL_DATABASE
            - name: MARIADB_USER
              valueFrom:
                configMapKeyRef:
                  name: cloud-config
                  key: MYSQL_USER
            # --- sensitive: from the Secret, never with "value:" ---
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloud-secrets
                  key: mysql-user-pw
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloud-secrets
                  key: mysql-root-pw
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # Readiness only, no liveness. During the first-boot initialisation
          # mysqld is not reachable, so this probe fails, the pod is not marked
          # Ready, and the Service routes nothing to it. That is exactly the
          # wanted behaviour.
          #
          # healthcheck.sh ships with the official MariaDB image. It runs as the
          # mysql user over the local Unix socket, so it needs no credential on
          # the command line - nothing for TEST 3's grep to find - and it
          # proves the server can actually answer a query.
          #   --su-mysql : run as the mysql system user
          #   --connect  : open a real client connection and query the server
          #   --innodb   : check that the InnoDB engine is up, not just mysqld
          #
          # A plain tcpSocket probe on 3306 also works, but it connects and
          # hangs up without speaking the protocol, so MariaDB logs
          # "Aborted connection ... unauthenticated" once per period - noise
          # that looks like an attack in the logs and is only the kubelet.
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --su-mysql
                - --connect
                - --innodb
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb-data
---
# EX-03: the stable name. EX-08: ClusterIP, which by construction has no
# route from outside the cluster - there is nothing to "close". Putting a
# NodePort here to debug with a SQL client is exactly the mistake to avoid;
# use "kubectl port-forward svc/mariadb 3306:3306 -n cloud" instead, which is
# temporary and audited.
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: cloud
  labels:
    app: mariadb
spec:
  type: ClusterIP
  selector:
    app: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
